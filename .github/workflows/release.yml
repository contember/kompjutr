name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/sqlite/package.json').version")"
          if [ "$version" = "0.0.0" ]; then
            echo "Refusing to release placeholder version 0.0.0" >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
          for package in sqlite drive git do local; do
            package_version="$(node -p "require('./packages/$package/package.json').version")"
            if [ "$package_version" != "$version" ]; then
              echo "@kompjutr/$package is $package_version, expected $version" >&2
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
      - name: Build and test the release artifact
        run: npm run package:smoke -- --pack-destination release-artifacts/npm-package
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release-artifacts/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  test:
    name: test (${{ matrix.job }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Match the shell parity oracles; Ubuntu 24.04's rev hangs on UTF-8 in LC_ALL=C.
    container: ubuntu:25.10
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4]
    steps:
      - name: Install parity reference binaries
        run: |
          apt-get update
          apt-get install --yes ca-certificates
          # The git-core PPA with its signing key pinned (fingerprint
          # F911AB184317630C59970973E363C90F8F1B6217): add-apt-repository asks the
          # Launchpad API for it, which took up to 135 s on a runner.
          cat > /etc/apt/sources.list.d/git-core-ppa.sources <<'SOURCES'
          Types: deb
          URIs: https://ppa.launchpadcontent.net/git-core/ppa/ubuntu
          Suites: questing
          Components: main
          Signed-By:
           -----BEGIN PGP PUBLIC KEY BLOCK-----
           Comment: Hostname:
           Version: Hockeypuck 2.2
           .
