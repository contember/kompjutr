name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/sqlite/package.json').version")"
          if [ "$version" = "0.0.0" ]; then
            echo "Refusing to release placeholder version 0.0.0" >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
          for package in sqlite drive git do local; do
            package_version="$(node -p "require('./packages/$package/package.json').version")"
            if [ "$package_version" != "$version" ]; then
              echo "@kompjutr/$package is $package_version, expected $version" >&2
              exit 1
            fi
          done
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - name: Install parity reference binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - run: npm run test:full
      - run: npm run build
      - name: Build and test the release artifact
        run: npm run package:smoke -- --pack-destination "${{ runner.temp }}/npm-package"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - name: Publish verified artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          for package in sqlite drive git do local; do
            tarball="package/kompjutr-$package-$version.tgz"
            specifier="@kompjutr/$package@$version"
            if npm view "$specifier" version --silent >/dev/null 2>&1; then
              published_integrity="$(npm view "$specifier" dist.integrity --silent)"
              local_integrity="$(node -e 'const crypto = require("node:crypto"); const fs = require("node:fs"); process.stdout.write(`sha512-${crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64")}`)' "$tarball")"
              if [ "$published_integrity" != "$local_integrity" ]; then
                echo "$specifier exists with different tarball integrity" >&2
                exit 1
              fi
              echo "$specifier already contains the verified tarball; skipping"
              continue
            fi
            npm publish "$tarball" --access public --provenance
          done
