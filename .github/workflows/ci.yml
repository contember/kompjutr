name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Match the shell parity oracles; Ubuntu 24.04's rev hangs on UTF-8 in LC_ALL=C.
    container: ubuntu:25.10
    timeout-minutes: 30
    steps:
      - name: Install parity reference binaries
        run: |
          apt-get update
          apt-get install --yes ca-certificates software-properties-common
          add-apt-repository --yes ppa:git-core/ppa
          apt-get install --yes ca-certificates git ripgrep jq tree patch mawk diffutils findutils grep sed util-linux coreutils-from-uutils
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run test:full
      - run: npm run build
      - run: npm run package:smoke
