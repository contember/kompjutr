name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Match the shell parity oracles; Ubuntu 24.04's rev hangs on UTF-8 in LC_ALL=C.
    container: ubuntu:25.10
    timeout-minutes: 30
    steps:
      - name: Install parity reference binaries
        run: |
          apt-get update
          apt-get install --yes ca-certificates software-properties-common
          add-apt-repository --yes ppa:git-core/ppa
          apt-get install --yes ca-certificates curl git jq tree patch mawk diffutils findutils grep sed util-linux coreutils-from-uutils
          # rg 15 fixed the --json summary statistics; Ubuntu still ships 14.
          rg_archive=ripgrep-15.1.0-x86_64-unknown-linux-musl
          cd "$(mktemp -d)"
          curl -fsSLO "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/${rg_archive}.tar.gz"
          echo "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  ${rg_archive}.tar.gz" | sha256sum --check -
          tar -xzf "${rg_archive}.tar.gz" -C /usr/local/bin --strip-components=1 "${rg_archive}/rg"
          rg --version
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run test:full
      - run: npm run build
      - run: npm run package:smoke
